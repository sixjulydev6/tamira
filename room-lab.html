<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Lab</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0a09; color: #f3f1ee; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100svh; }
    #ref { position: fixed; pointer-events: none; opacity: 0; max-width: none; }
    .panel { position: fixed; left: 16px; bottom: 16px; display: grid; gap: 8px; padding: 12px 14px; width: min(320px, calc(100vw - 32px));
             background: rgba(16, 14, 12, 0.82); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; backdrop-filter: blur(12px); }
    .row { display: grid; grid-template-columns: 92px 1fr 38px; align-items: center; gap: 8px; }
    .row input[type=range] { width: 100%; }
    .toggles { display: flex; flex-wrap: wrap; gap: 6px 12px; }
    .toggles label { display: inline-flex; gap: 5px; align-items: center; }
    .stat { font-variant-numeric: tabular-nums; opacity: 0.7; }
    h1 { margin: 0; font-size: 13px; font-weight: 600; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; opacity: 0.8; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <img id="ref" alt="">
  <div id="loading">Loading room…</div>
  <div class="panel" role="group" aria-label="Room lab controls">
    <h1>Live GLB room · lab</h1>
    <div class="row"><span>Lighting step</span><input id="state" type="range" min="0" max="5" step="1" value="5"><output id="stateV">5</output></div>
    <div class="row"><span>Pull-back</span><input id="pull" type="range" min="0" max="1" step="0.001" value="1"><output id="pullV">1.00</output></div>
    <div class="row"><span>Image overlay</span><input id="cmp" type="range" min="0" max="1" step="0.01" value="0"><output id="cmpV">0</output></div>
    <div class="row"><span>Exposure</span><input id="exp" type="range" min="-2" max="2" step="0.05" value="0.4"><output id="expV">0.40</output></div>
    <div class="toggles">
      <label><input id="orbit" type="checkbox"> Free look</label>
      <label><input id="ao" type="checkbox" checked> AO</label>
      <label><input id="shadows" type="checkbox" checked> Shadows</label>
    </div>
    <div class="stat" id="stat"></div>
  </div>
  <script type="module" src="/src/room-lab/main.js"></script>
</body>
</html>
